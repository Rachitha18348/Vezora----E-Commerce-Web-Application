{% extends "base.html" %}

{% block title %}Page Not Found | VEZORA{% endblock %}

{% block css %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/404.css') }}">
{% endblock %}

{% block content %}

<section class="error-page">


<div class="error-card">

    <p class="error-eyebrow">
        VEZORA
    </p>

    <div class="error-number">
        404
    </div>

    <h1>
        Page Not Found
    </h1>

    <p>
        The page you are looking for may have moved,
        been removed, or may no longer exist.
    </p>

    <div class="error-actions">

        <a
            href="{{ url_for('dashboard') if session.get('user_id') else url_for('home') }}"
            class="primary-button"
        >
            GO TO HOME
        </a>

        <a
            href="{{ url_for('products') }}"
            class="secondary-button"
        >
            SHOP PRODUCTS
        </a>

    </div>

</div>


</section>

{% endblock %}
